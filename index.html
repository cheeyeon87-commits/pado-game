<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>파도 영토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22303F;--paper:#E6D3A3;--paper-dark:#C9AE72;--sea:#1C5D73;--blood:#B3262E;--gold:#E9B63A}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--ink);
  font-family:"Gowun Batang",serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
.brush{font-family:"East Sea Dokdo","Gowun Batang",serif;font-weight:400}

/* 해도(바다 고르기) */
#chart{position:fixed;inset:0;overflow:hidden;padding:max(20px,env(safe-area-inset-top)) 20px 20px;
  background:
    radial-gradient(circle at 12% 8%,rgba(120,80,30,.28),transparent 34%),
    radial-gradient(circle at 92% 96%,rgba(120,80,30,.34),transparent 40%),
    radial-gradient(circle at 80% 30%,rgba(255,244,200,.5),transparent 45%),
    var(--paper)}
#chart h1{font-size:clamp(72px,24vw,120px);line-height:.8;transform:rotate(-4deg);transform-origin:left;margin-top:8px;width:max-content;pointer-events:none}
#chart .lead{margin-top:18px;font-size:16px;line-height:1.6;max-width:22em}
.route{position:absolute;left:0;right:0;top:230px;bottom:20px}
.route svg{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;transform:translate(-50%,-50%);background:none;border:0;color:inherit;font:inherit;
  text-align:center;cursor:pointer;padding:6px}
.stop canvas{position:static;width:104px;height:104px;border-radius:50%;border:3px solid var(--ink);
  box-shadow:0 0 0 5px var(--paper),0 0 0 6px var(--ink)}
.stop .name{display:block;font-size:40px;line-height:1;margin-top:8px}
.stop .prog{display:block;font-size:14px;margin-top:2px}
.stop:focus-visible canvas{outline:3px solid var(--blood);outline-offset:8px}
.stop.locked{cursor:default;opacity:.55}
.stop.done .prog{color:var(--blood);font-weight:700}

/* 게임 화면 */
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;padding:max(12px,env(safe-area-inset-top)) 12px 12px}
#goal{height:26px;border-radius:13px;background:rgba(18,30,45,.7);border:2px solid var(--paper);overflow:hidden;position:relative}
#goalFill{height:100%;width:0;background:var(--blood);transition:width .2s}
#goalText{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:14px}
#kills{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 36px);
  background:rgba(18,30,45,.7);border-radius:10px;padding:4px 10px;font-weight:700}
#board{position:absolute;right:12px;top:calc(max(12px,env(safe-area-inset-top)) + 36px);list-style:none;padding:0;
  font-size:13px;font-weight:700;min-width:132px}
#board li{display:flex;justify-content:space-between;gap:10px;padding:3px 8px;margin-bottom:3px;border-radius:8px;
  background:rgba(18,30,45,.7);border-left:6px solid var(--c)}
#board li.me{background:rgba(230,211,163,.92);color:var(--ink)}
#hint{position:absolute;left:16px;right:16px;bottom:max(28px,env(safe-area-inset-bottom));text-align:center;
  background:rgba(230,211,163,.94);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5}

#goal .tick{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:rgba(230,211,163,.45)}
#goal .tick.got{background:var(--gold)}
#purse{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 72px);
  background:rgba(18,30,45,.7);border-radius:10px;padding:4px 10px;font-weight:700;color:var(--gold)}
#buff{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 108px);
  background:rgba(230,211,163,.92);color:var(--ink);border-radius:10px;padding:4px 10px;font-weight:700}
.coin{display:inline-block;width:.85em;height:.85em;border-radius:50%;background:var(--gold);
  box-shadow:inset 0 0 0 2px #B98A1F;vertical-align:-.08em;margin-right:.3em}
#harbor{position:absolute;right:16px;top:max(20px,env(safe-area-inset-top));text-align:right;z-index:2}
#harbor .have{font-weight:700;font-size:17px}
#harbor button,#dock .close{font:inherit;font-weight:700;font-size:15px;margin-top:8px;padding:9px 14px;
  background:var(--ink);color:var(--paper);border:0;border-radius:6px;cursor:pointer}
#dock{position:fixed;inset:0;background:var(--paper);overflow:auto;padding:max(20px,env(safe-area-inset-top)) 20px 28px;touch-action:pan-y}
#dock h2{font-size:64px;line-height:.9}
#dock .have{font-weight:700;margin:6px 0 14px}
.ship{display:grid;grid-template-columns:96px 1fr;gap:4px 14px;align-items:center;padding:14px 0;border-top:2px solid var(--ink)}
.ship canvas{position:static;width:96px;height:72px;grid-row:span 3;border-radius:6px}
.ship h3{font-size:18px}
.ship p{font-size:14px;line-height:1.4}
.ship button{font:inherit;font-weight:700;font-size:15px;padding:9px 12px;border:2px solid var(--ink);border-radius:6px;
  background:transparent;color:var(--ink);cursor:pointer;justify-self:start}
.ship button.buy{background:var(--blood);border-color:var(--blood);color:#fff}
.ship button:disabled{opacity:.5;cursor:default}
#harbor button:focus-visible,#dock button:focus-visible{outline:3px solid var(--blood);outline-offset:2px}

/* 결과 */
#result{position:fixed;inset:0;display:grid;place-items:center;background:rgba(18,30,45,.6);padding:20px}
#result .card{background:var(--paper);border:3px solid var(--ink);border-radius:6px;padding:24px 22px;width:min(340px,100%);
  text-align:center;box-shadow:6px 8px 0 rgba(0,0,0,.35)}
#result h2{font-size:56px;line-height:.9}
#result dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;margin:18px 0;font-size:16px}
#result dd{font-weight:700;text-align:right}
#result button{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px;margin-top:10px;
  border:2px solid var(--ink);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
#result button.main{background:var(--blood);color:#fff;border-color:var(--blood)}
#result button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="goal"><div id="goalFill"></div><i class="tick" style="left:20%"></i><i class="tick" style="left:40%"></i><i class="tick" style="left:60%"></i><i class="tick" style="left:80%"></i><div id="goalText"></div></div>
  <div id="kills"></div>
  <div id="purse"></div>
  <div id="buff" hidden></div>
  <ol id="board"></ol>
  <div id="hint">화면 아무 곳이나 누르면 조이스틱이 생겨요. 가고 싶은 쪽으로 밀어요.<br>내 바다 밖으로 나갔다가 돌아오면, 물길로 둘러싼 곳이 내 바다가 돼요.<br>해안에 붙어서 가면 점점 빨라져요.</div>
</div>

<main id="chart">
  <div id="harbor"><div class="have" id="haveChart"></div><button id="openDock">내 배 고르기</button></div>
  <h1 class="brush">파도 영토</h1>
  <p class="lead">물길로 바다를 둘러싸서 내 것으로 만드세요. 바다 하나를 정복하면 다음 바다가 열려요.</p>
  <div class="route" id="route"></div>
</main>

<section id="dock" hidden>
  <h2 class="brush">조선소</h2>
  <p class="have" id="haveDock"></p>
  <div id="ships"></div>
  <button class="close" id="closeDock">해도로 돌아가기</button>
</section>

<div id="result" hidden>
  <div class="card">
    <h2 class="brush" id="rTitle"></h2>
    <dl>
      <dt>이번 항해에서 차지한 바다</dt><dd id="rShare"></dd>
      <dt>가라앉힌 배</dt><dd id="rKills"></dd>
      <dt>얻은 금화</dt><dd id="rCoins"></dd>
      <dt id="rSeaName"></dt><dd id="rProg"></dd>
    </dl>
    <button class="main" id="rMain"></button>
    <button id="rBack">해도로 돌아가기</button>
  </div>
</div>

<script>
// WU: 바다 크기(단위). U: 단위 하나를 몇 칸으로 쪼개는지(클수록 곡선이 곱다). 배 위치와 속도는 단위로 센다
const WU = 84, U = 2, N = WU*U, GOAL = 0.5;
// 바다 모양: [중심x, 중심y, 가로반지름, 세로반지름] 타원. sea는 바다, isl은 섬/육지 (단순화한 모양)
const SEAS = [
  {name:'카리브해', sea:[[.5,.52,.47,.36],[.24,.34,.22,.2]],
   isl:[[.42,.3,.14,.028],[.63,.37,.07,.035],[.44,.43,.04,.016],[.8,.42,.012,.02],[.84,.5,.012,.02],[.85,.6,.014,.022],[.82,.7,.016,.02]]},
  {name:'지중해', sea:[[.28,.5,.26,.2],[.68,.54,.3,.22],[.5,.46,.22,.13]],
   isl:[[.45,.36,.035,.15],[.5,.57,.045,.025],[.36,.44,.018,.04],[.72,.64,.05,.015],[.88,.57,.03,.015]]},
  {name:'인도양', sea:[[.5,.52,.46,.44]],
   isl:[[.55,.08,.1,.24],[.22,.68,.04,.1],[.61,.36,.02,.03],[.78,.3,.02,.06],[.4,.8,.015,.015]]},
];
const CREW = [
  {name:'나', color:'#C8323B'},
  {name:'외눈 메리', color:'#E0A82E'},
  {name:'은갈고리 한', color:'#7D5BA6'},
  {name:'검은돛 도로', color:'#2FA37A'},
  {name:'폭풍의 진', color:'#E07A2E'},
  {name:'앵무 선장', color:'#E6DFCF'},
];
// 내가 고를 수 있는 해적선(겉모습만 다르고 성능은 같다)
const SHIPS = [
  {name:'슬루프 "붉은 돛"', desc:'작고 날랜 첫 배.', price:0, color:'#C8323B', sail:'#F3E9D2', hull:'#3B2414'},
  {name:'브리건틴 "푸른 밤"', desc:'돛대가 둘인 푸른 배.', price:100, color:'#4F7BE8', sail:'#DCE6FF', hull:'#22304F', masts:2},
  {name:'갤리온 "먹빛 돛"', desc:'검은 돛을 단 큰 배.', price:300, color:'#34323C', sail:'#17161B', hull:'#1E1410', masts:3},
  {name:'유령선 "새벽 안개"', desc:'안개처럼 빛나는 배.', price:600, color:'#9FE8D8', sail:'#E9FFF9', hull:'#4C6F6A', masts:3},
];
const ITEMS = {wind:{name:'순풍', sec:4}, shield:{name:'방어막', sec:7}};
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W, H, cs;
function resize(){
  const r = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight; cv.width = W*r; cv.height = H*r; ctx.setTransform(r,0,0,r,0,0);
  cs = Math.max(13, Math.min(W,H)/26);
}
addEventListener('resize', resize); resize();

let save;
try { save = JSON.parse(localStorage.getItem('pado-yeongto')); } catch(e){}
if (!save) save = {prog:[0,0,0]};
save.coins ??= 0; save.ships ??= [0]; save.ship ??= 0;
function store(){ try { localStorage.setItem('pado-yeongto', JSON.stringify(save)); } catch(e){} }

const G = {state:'chart', sea:0, players:[], best:0};
window.G = G;
let land, own, trail, seaTotal;

function landMask(s){
  const m = new Uint8Array(N*N);
  const inside = (e,u,v) => ((u-e[0])/e[2])**2 + ((v-e[1])/e[3])**2 <= 1;
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const u=(x+.5)/N, v=(y+.5)/N;
    const sea = x>0 && y>0 && x<N-1 && y<N-1 && s.sea.some(e=>inside(e,u,v)) && !s.isl.some(e=>inside(e,u,v));
    m[y*N+x] = sea ? 0 : 1;
  }
  return m;
}
const isLand = (x,y) => x<0||y<0||x>=WU||y>=WU||land[(y*U|0)*N+(x*U|0)] === 1;
const cellAt = (x,y) => (y*U|0)*N+(x*U|0);

function spawn(p){
  for (let t=0;t<600;t++){
    const x=6+Math.random()*(WU-12), y=6+Math.random()*(WU-12), gx=x*U|0, gy=y*U|0, r=3.5*U|0;
    let ok=true;
    for (let dy=-r;dy<=r&&ok;dy++) for (let dx=-r;dx<=r;dx++){
      const i=(gy+dy)*N+gx+dx; if (land[i]||own[i]>=0||trail[i]>=0){ok=false;break;}
    }
    const far = t<300 ? 16 : 8;
    if (!ok || G.players.some(q=>q!==p&&q.alive&&Math.hypot(q.x-x,q.y-y)<far)) continue;
    const R=2.6*U;
    for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++) if (dx*dx+dy*dy<=R*R) own[(gy+dy)*N+gx+dx]=p.id;
    Object.assign(p,{x,y,cell:gy*N+gx,alive:true,trail:[],path:[],wind:0,shield:0,boost:0,hugT:0,side:1,
      ang:-Math.PI/2,want:-Math.PI/2,head:-Math.PI/2,d:0,thinkT:0,a0:null,s:1,L1:6,L2:6,home:[x,y]});
    recount(); return true;
  }
  return false;
}
function recount(){
  for (const p of G.players) p.count=0;
  for (let i=0;i<N*N;i++) if (own[i]>=0) G.players[own[i]].count++;
}
function kill(p, by){
  if (!p.alive) return;
  p.alive=false; p.respawn=3;
  for (let i=0;i<N*N;i++){ if (own[i]===p.id) own[i]=-1; if (trail[i]===p.id) trail[i]=-1; }
  p.trail=[]; p.path=[]; if (by){ by.kills++; if (by.id===0) G.coins+=5; }
  recount();
  if (p.id===0) endRound(false);
}
// 물길을 내 바다에 이었을 때: 물길 + 물길로 둘러싸인 안쪽을 모두 내 바다로 만든다
// 영토가 남에게 잘려 여러 조각이 되면, 배가 있는 조각(바다에 나가 있으면 출발한 조각)만 남기고 나머지는 사라진다
function prune(o){
  const ref=o.path.length?o.path[0]:[o.x,o.y], rx=ref[0]*U, ry=ref[1]*U;
  let seed=cellAt(ref[0],ref[1]);
  if (own[seed]!==o.id){ seed=-1; let bd=1e9;
    for (let i=0;i<N*N;i++) if (own[i]===o.id){ const d=(i%N-rx)**2+((i/N|0)-ry)**2; if (d<bd){ bd=d; seed=i; } } }
  if (seed<0) return;
  const seen=new Uint8Array(N*N), q=[seed]; seen[seed]=1;
  const push=i=>{ if (!seen[i]&&own[i]===o.id){ seen[i]=1; q.push(i); } };
  while (q.length){ const i=q.pop(), x=i%N;
    if (x>0) push(i-1); if (x<N-1) push(i+1); if (i>=N) push(i-N); if (i<N*(N-1)) push(i+N); }
  for (let i=0;i<N*N;i++) if (own[i]===o.id&&!seen[i]) own[i]=-1;
}
function capture(p){
  const before=G.players.map(o=>o.count);
  for (const c of p.trail){ own[c]=p.id; trail[c]=-1; }
  p.trail=[]; p.path=[];
  const seen=new Uint8Array(N*N), q=[];
  const push=i=>{ if(!seen[i]&&own[i]!==p.id){seen[i]=1;q.push(i);} };
  for (let k=0;k<N;k++){ push(k); push((N-1)*N+k); push(k*N); push(k*N+N-1); }
  while(q.length){ const i=q.pop(), x=i%N;
    if (x>0) push(i-1); if (x<N-1) push(i+1); if (i>=N) push(i-N); if (i<N*(N-1)) push(i+N); }
  for (let i=0;i<N*N;i++) if (!seen[i]&&!land[i]) own[i]=p.id;
  recount();
  for (const o of G.players) if (o!==p&&o.alive&&o.count>0&&o.count<before[o.id]) prune(o);
  recount();
  for (const o of G.players) if (o.alive&&o.count===0) kill(o,p);
}
const norm = a => Math.atan2(Math.sin(a),Math.cos(a));
function step(p,dt){
  const turn=(p.id?7:14)*dt; p.ang += Math.max(-turn,Math.min(turn,norm(p.want-p.ang)));
  if (p.wind>0) p.wind-=dt; if (p.shield>0) p.shield-=dt;
  const dist=p.speed*Math.min(2.5,(1+p.boost)*(p.wind>0?1.5:1))*dt, n=Math.ceil(dist*U/.45);
  let hug=false; const ox=p.x, oy=p.y;
  for (let k=0;k<n&&p.alive&&G.state==='play';k++) if (move(p,dist/n)) hug=true;
  // 해안 타기: 해안에 붙어 나아가는 동안 조금씩 빨라져 최대 2배. 떨어지거나 구석에 막히면 금방 원래 속도로
  if (hug&&Math.hypot(p.x-ox,p.y-oy)>dist*.5) p.hugT=.3; else p.hugT-=dt;
  p.boost = p.hugT>0 ? Math.min(1,p.boost+dt*.45) : Math.max(0,p.boost-dt*1.5);
  p.blocked=hug;
}
function move(p,d){
  let a=p.ang, hug=false;
  if (isLand(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d)){
    hug=true; a=null;                       // 막히면 해안을 따라 미끄러질 방향을 찾는다
    for (let k=1;k<=6&&a===null;k++) for (const sd of [p.side,-p.side]){
      if (k===6&&sd!==p.side) break;       // 반대쪽으로는 직각까지 꺾지 않는다(구석에서 떨지 않게)
      const b=p.ang+sd*k*.2618;
      if (!isLand(p.x+Math.cos(b)*d,p.y+Math.sin(b)*d)){ a=b; p.side=sd; break; }
    }
    if (a===null) return false;            // 구석에 막혀 못 움직이면 빨라지지 않는다
  }
  p.head += norm(a-p.head)*.35;
  const ox=p.x, oy=p.y;
  p.x+=Math.cos(a)*d; p.y+=Math.sin(a)*d;
  for (let k=G.items.length-1;k>=0;k--){ const it=G.items[k];
    if (Math.hypot(it.x-p.x,it.y-p.y)<1.3){ p[it.type]=ITEMS[it.type].sec; G.items.splice(k,1); } }
  const c=cellAt(p.x,p.y);
  if (c!==p.cell){
    p.cell=c;
    const t=trail[c];
    if (t>=0&&t!==p.id){
      const o=G.players[t];
      if (o.shield>0) o.shield=0;            // 방어막이 물길을 한 번 지켜 준다
      else kill(o,p);
      if (!p.alive) return hug;
    }
    if (own[c]===p.id){ if (p.trail.length) capture(p); return hug; }
  }
  if (own[c]===p.id) return hug;
  // 물길: 배 둘레 2x2칸에 남긴다(물길 폭이 배 폭과 비슷해지게)
  if (!p.path.length) p.path.push([ox,oy]);
  const L=p.path[p.path.length-1]; if (Math.hypot(p.x-L[0],p.y-L[1])>.3) p.path.push([p.x,p.y]);
  const gx=Math.round(p.x*U)-1, gy=Math.round(p.y*U)-1;
  for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++){
    const i=(gy+dy)*N+gx+dx;
    if (!land[i]&&own[i]!==p.id&&trail[i]<0){ trail[i]=p.id; p.trail.push(i); }
  }
  return hug;
}
// 컴퓨터 배의 판단(1초에 10번).
// 1) 내 물길이 위험하면 집으로 2) 가까운 남의 물길은 끊으러 3) 아니면 영토 크기에 맞는 네모를 그리며 넓힌다
function scan(b,R,hit){
  const cx=b.x*U|0, cy=b.y*U|0, r=R*U|0; let best=null, bd=1e9;
  for (let y=Math.max(0,cy-r);y<=Math.min(N-1,cy+r);y++) for (let x=Math.max(0,cx-r);x<=Math.min(N-1,cx+r);x++){
    if (!hit(y*N+x)) continue;
    const d=(x-cx)**2+(y-cy)**2; if (d<bd){ bd=d; best=[(x+.5)/U,(y+.5)/U,Math.sqrt(d)/U]; }
  }
  return best;
}
const clearAhead=(b,a,d)=>!isLand(b.x+Math.cos(a)*d,b.y+Math.sin(a)*d)&&!isLand(b.x+Math.cos(a)*d*.5,b.y+Math.sin(a)*d*.5);
function think(b,dt){
  if ((b.thinkT-=dt)>0) return; b.thinkT=.1;
  const out=b.trail.length>0, to=(x,y)=>Math.atan2(y-b.y,x-b.x);
  if (!out){
    b.d=0; b.home=[b.x,b.y];
    if (b.a0===null||b.blocked){           // 아직 내 바다가 아닌 쪽을 골라 나간다
      const rad=Math.sqrt(b.count/3.14)/U, cand=[];
      for (let k=0;k<12;k++){ const a=k*.5236, x=b.x+Math.cos(a)*(rad+4), y=b.y+Math.sin(a)*(rad+4);
        if (!isLand(x,y)&&own[cellAt(x,y)]!==b.id&&clearAhead(b,a,3)) cand.push(a); }
      b.a0=cand.length?cand[Math.random()*cand.length|0]:Math.random()*6.28;
      b.s=Math.random()<.5?1:-1;
      const size=Math.min(15,(3+rad*.9)*b.bold);
      b.L1=size*(.7+Math.random()*.6); b.L2=size*(.7+Math.random()*.6);
    }
    b.want=b.a0;
  } else {
    b.d+=b.speed*.1;
    let danger=false;                       // 남의 배가 내 물길에, 내가 집에 가는 것보다 빨리 닿을 수 있나
    const dHome=Math.hypot(b.home[0]-b.x,b.home[1]-b.y);
    for (const o of G.players){ if (o===b||!o.alive) continue;
      for (let k=0;k<b.path.length;k+=4) if (Math.hypot(o.x-b.path[k][0],o.y-b.path[k][1])<dHome+3){ danger=true; break; }
      if (danger) break; }
    const phase = danger||b.d>=2*b.L1+b.L2 ? 3 : b.d<b.L1 ? 0 : b.d<b.L1+b.L2 ? 1 : 2;
    if (phase===3){
      if (own[cellAt(b.home[0],b.home[1])]!==b.id){ const h=scan(b,14,i=>own[i]===b.id); if (h) b.home=h; }
      b.want=to(b.home[0],b.home[1]); b.a0=null;
    } else {
      b.want=b.a0+b.s*phase*Math.PI/2;
      if (!clearAhead(b,b.want,2.5)) b.d=[b.L1,b.L1+b.L2,2*b.L1+b.L2][phase];   // 앞이 육지면 다음 변으로
    }
  }
  if (b.hunter&&(!out||b.trail.length<30)){
    const t=scan(b,5.5,i=>trail[i]>=0&&trail[i]!==b.id);
    if (t) b.want=to(t[0],t[1]);
  }
}

function startRound(i){
  G.sea=i; G.best=0; G.t=0; G.coins=0; G.mile=0; G.items=[]; G.itemT=3;
  land=landMask(SEAS[i]); own=new Int8Array(N*N).fill(-1); trail=new Int8Array(N*N).fill(-1);
  seaTotal=land.reduce((a,v)=>a+(v?0:1),0);
  G.players=CREW.map((c,id)=>({...c,id,kills:0,count:0,alive:false,trail:[],speed:id?8.2:9,hunter:id!==4,bold:.8+id*.12}));
  Object.assign(G.players[0],SHIPS[save.ship],{name:'나'});
  for (const p of G.players) spawn(p);
  $('chart').hidden=true; $('result').hidden=true; $('hud').hidden=false; $('hint').hidden=false;
  G.state='play'; hud();
}
function endRound(won){
  G.state='over';
  const me=G.players[0], i=G.sea;
  save.prog[i]=Math.min(100, won?100:save.prog[i]+Math.round(G.best*100/GOAL));
  if (won) G.coins+=30;
  save.coins+=G.coins; store();
  const done=save.prog[i]>=100, next=i+1<SEAS.length;
  $('rTitle').textContent = done ? SEAS[i].name+' 정복!' : '배가 가라앉았어요';
  $('rShare').textContent=(G.best*100).toFixed(1)+'%';
  $('rKills').textContent=me.kills+'척';
  $('rCoins').textContent=G.coins+'닢';
  $('rSeaName').textContent=SEAS[i].name+' 정복도';
  $('rProg').textContent=save.prog[i]+'%';
  const main=$('rMain');
  if (done&&next){ main.textContent='다음 바다로 출항'; main.onclick=()=>startRound(i+1); }
  else { main.textContent='다시 출항'; main.onclick=()=>startRound(i); }
  $('hud').hidden=true; $('result').hidden=false; main.focus();
}
$('rBack').onclick=showChart;

function hud(){
  const me=G.players[0], share=me.count/seaTotal;
  $('goalFill').style.width=Math.min(100,share/GOAL*100)+'%';
  $('goalText').textContent=`${(share*100).toFixed(1)}% / 목표 ${GOAL*100}%`;
  $('kills').textContent='격침 '+me.kills;
  $('purse').innerHTML='<i class="coin"></i>'+G.coins;
  document.querySelectorAll('#goal .tick').forEach((t,k)=>t.classList.toggle('got',k<G.mile));
  const b=['wind','shield'].filter(k=>me[k]>0).map(k=>ITEMS[k].name+' '+Math.ceil(me[k])+'초');
  if (me.boost>.1) b.push('해안 타기 '+(1+me.boost).toFixed(1)+'배');
  $('buff').hidden=!b.length; $('buff').textContent=b.join(' · ');
  const rank=G.players.filter(p=>p.alive).sort((a,b)=>b.count-a.count);
  const rows=rank.slice(0,3); if (me.alive&&!rows.includes(me)) rows.push(me);
  $('board').innerHTML=rows.map(p=>`<li class="${p.id?'':'me'}" style="--c:${p.color}"><span>${rank.indexOf(p)+1}. ${p.name}</span><span>${(p.count/seaTotal*100).toFixed(1)}%</span></li>`).join('');
}

function shipShape(c,s,p){
  c.fillStyle='rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(-s*.1,s*.12,s*1.05,s*.55,0,0,7); c.fill();
  c.fillStyle=p.hull||'#3B2414'; c.beginPath(); c.moveTo(s*1.15,0);
  c.quadraticCurveTo(s*.3,s*.66,-s*.9,s*.42); c.lineTo(-s*.9,-s*.42); c.quadraticCurveTo(s*.3,-s*.66,s*1.15,0); c.fill();
  c.fillStyle='#8A5A2B'; c.beginPath(); c.ellipse(0,0,s*.7,s*.28,0,0,7); c.fill();
  c.fillStyle=p.sail||'#F3E9D2'; c.fillRect(-s*.2,-s*.8,s*.24,s*1.6);
  if ((p.masts||2)>=2) c.fillRect(s*.42,-s*.52,s*.18,s*1.04);
  if (p.masts>=3) c.fillRect(-s*.68,-s*.6,s*.18,s*1.2);
  c.fillStyle=p.color; c.fillRect(-s*.2,-s*.3,s*.24,s*.6);
}
function drawShip(p,camx,camy){
  const s=cs*.95, x=p.x*cs-camx, y=p.y*cs-camy;
  if (p.shield>0){ ctx.strokeStyle='#E9B63A'; ctx.lineWidth=3; ctx.globalAlpha=.9;
    ctx.beginPath(); ctx.arc(x,y,s*1.5,0,7); ctx.stroke(); ctx.globalAlpha=1; }
  ctx.save(); ctx.translate(x,y); ctx.rotate(p.head);
  if (p.wind>0||p.boost>.2){ ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2; ctx.beginPath();
    for (const o of [-.5,0,.5]){ ctx.moveTo(-s*1.2,s*o); ctx.lineTo(-s*2.1,s*o); } ctx.stroke(); }
  shipShape(ctx,s,p);
  ctx.restore();
  ctx.font='700 12px "Gowun Batang",serif'; ctx.textAlign='center';
  ctx.lineWidth=3; ctx.strokeStyle='rgba(18,30,45,.8)'; ctx.fillStyle='#fff';
  ctx.strokeText(p.name,x,y-cs*1.3); ctx.fillText(p.name,x,y-cs*1.3);
}
function drawItems(camx,camy){
  for (const it of G.items){
    const x=it.x*cs-camx, y=it.y*cs-camy+Math.sin(G.t*3+it.x)*2, r=cs*.62;
    ctx.fillStyle='#6B4423'; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    ctx.strokeStyle='#E6D3A3'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke();
    if (it.type==='shield'){ ctx.strokeStyle='#E9B63A'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,y,r*.48,0,7); ctx.stroke(); }
    else { ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.beginPath();
      for (const o of [-.3,0,.3]){ ctx.moveTo(x-r*.5,y+r*o); ctx.lineTo(x+r*.5,y+r*o); } ctx.stroke(); }
  }
}
// 그리기: 칸 그대로가 아니라, 칸을 살짝 번지게 한 값에서 경계선을 뽑아 부드러운 곡선으로 그린다
const TH=.47, BW=[1,3,5,6,5,3,1];   // 넓게 번지게 할수록 영토 가장자리가 고르다
let field=null;
function fields(x0,y0,x1,y1){
  const K=G.players.length+1;
  if (!field||field.length!==K) field=Array.from({length:K},()=>new Float32Array(N*N));
  for (const f of field) for (let y=y0;y<=y1;y++) f.fill(0,y*N+x0,y*N+x1+1);
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const n=y*N+x;
    for (let dy=-3;dy<=3;dy++) for (let dx=-3;dx<=3;dx++){
      const xx=x+dx, yy=y+dy;
      let id=K-1;
      if (xx>=0&&yy>=0&&xx<N&&yy<N){ const i=yy*N+xx; id=land[i]?K-1:own[i]; }
      if (id>=0) field[id][n]+=BW[dx+3]*BW[dy+3]/576;
    }
  }
}
function contour(f,x0,y0,x1,y1,camx,camy){
  const cp=cs/U, P=new Path2D(), X=g=>(g+.5)*cp-camx, Y=g=>(g+.5)*cp-camy;
  const px=[0,1,1,0], py=[0,0,1,1], v=[0,0,0,0];
  for (let y=y0;y<y1;y++){
    let run=-1;
    for (let x=x0;x<=x1;x++){
      const n=y*N+x;
      if (x<x1){
        v[0]=f[n]; v[1]=f[n+1]; v[2]=f[n+N+1]; v[3]=f[n+N];
        const k=(v[0]>=TH)+(v[1]>=TH)+(v[2]>=TH)+(v[3]>=TH);
        if (k===4){ if (run<0) run=x; continue; }
        if (run>=0){ P.rect(X(run),Y(y),(x-run)*cp,cp+.5); run=-1; }
        if (!k) continue;
        let first=true;
        for (let i=0;i<4;i++){ const j=(i+1)&3;
          if (v[i]>=TH){ first?P.moveTo(X(x+px[i]),Y(y+py[i])):P.lineTo(X(x+px[i]),Y(y+py[i])); first=false; }
          if ((v[i]>=TH)!==(v[j]>=TH)){ const t=(TH-v[i])/(v[j]-v[i]);
            const qx=X(x+px[i]+(px[j]-px[i])*t), qy=Y(y+py[i]+(py[j]-py[i])*t);
            first?P.moveTo(qx,qy):P.lineTo(qx,qy); first=false; }
        }
        P.closePath();
      } else if (run>=0) P.rect(X(run),Y(y),(x-run)*cp,cp+.5);
    }
  }
  return P;
}
const shade=(hex,k)=>'#'+[1,3,5].map(i=>Math.round(parseInt(hex.slice(i,i+2),16)*k).toString(16).padStart(2,'0')).join('');
function draw(){
  const me=G.players[0], camx=me.x*cs-W/2, camy=me.y*cs-H/2, K=G.players.length+1, cp=cs/U;
  ctx.fillStyle='#1C5D73'; ctx.fillRect(0,0,W,H);
  const x0=Math.max(0,Math.floor(camx/cp)-3), y0=Math.max(0,Math.floor(camy/cp)-3);
  const x1=Math.min(N-1,Math.ceil((camx+W)/cp)+2), y1=Math.min(N-1,Math.ceil((camy+H)/cp)+2);
  fields(x0,y0,x1,y1);
  for (const p of G.players){
    if (!p.alive) continue;
    const P=contour(field[p.id],x0,y0,x1,y1,camx,camy);
    ctx.save(); ctx.translate(0,cs*.2); ctx.fillStyle=p.dark||(p.dark=shade(p.color,.6)); ctx.fill(P); ctx.restore();
    ctx.fillStyle=p.color; ctx.fill(P);
  }
  // 물길: 배가 실제로 지나간 길을 따라 굵은 띠로 그린다
  ctx.lineCap=ctx.lineJoin='round'; ctx.lineWidth=cs*.8; ctx.globalAlpha=.7;
  for (const p of G.players){
    if (!p.alive||!p.path.length) continue;
    ctx.strokeStyle=p.color; ctx.beginPath(); ctx.moveTo(p.path[0][0]*cs-camx,p.path[0][1]*cs-camy);
    for (const q of p.path) ctx.lineTo(q[0]*cs-camx,q[1]*cs-camy);
    ctx.lineTo(p.x*cs-camx,p.y*cs-camy); ctx.stroke();
  }
  ctx.globalAlpha=1;
  const L=contour(field[K-1],x0,y0,x1,y1,camx,camy);
  ctx.strokeStyle='rgba(243,233,200,.5)'; ctx.lineWidth=cs*.45; ctx.stroke(L);
  ctx.fillStyle='#D9C48F'; ctx.fill(L);
  const gx0=.5*cp-camx, gy0=.5*cp-camy, gx1=(N-.5)*cp-camx, gy1=(N-.5)*cp-camy;
  ctx.fillRect(0,0,W,gy0+1); ctx.fillRect(0,gy1-1,W,H); ctx.fillRect(0,0,gx0+1,H); ctx.fillRect(gx1-1,0,W,H);
  drawItems(camx,camy);
  for (const p of G.players) if (p.alive&&p.id) drawShip(p,camx,camy);
  if (me.alive) drawShip(me,camx,camy);
  drawJoy();
}

let last=0, hudT=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0); last=t;
  if (G.state==='play'){
    G.t+=dt; if (G.t>5) $('hint').hidden=true;
    for (const p of G.players){
      if (!p.alive){ if (p.id&&(p.respawn-=dt)<0) spawn(p); continue; }
      if (p.id) think(p,dt);
      step(p,dt);
      if (G.state!=='play') break;
    }
    if (G.state==='play'){
      const share=G.players[0].count/seaTotal; if (share>G.best) G.best=share;
      while (G.mile<4&&share>=(G.mile+1)*GOAL/5){ G.mile++; G.coins+=10; }
      if ((G.itemT-=dt)<0&&G.items.length<4){ G.itemT=6;
        for (let t=0;t<40;t++){ const x=2+Math.random()*(WU-4), y=2+Math.random()*(WU-4);
          if (!isLand(x,y)){ G.items.push({x,y,type:Math.random()<.5?'wind':'shield'}); break; } } }
      if ((hudT+=dt)>.2){ hudT=0; hud(); }
      if (share>=GOAL) endRound(true);
    }
  }
  if (G.state!=='chart') draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 조종: 손가락을 댄 자리에 작은 조이스틱이 생긴다. 그 중심에서 손가락을 민 방향으로 배가 간다
const JOY=34;
let joy=null;
cv.addEventListener('pointerdown',e=>{ if (G.state==='play') joy={x:e.clientX,y:e.clientY,kx:0,ky:0}; });
cv.addEventListener('pointermove',e=>{
  if (!joy||G.state!=='play') return;
  const dx=e.clientX-joy.x, dy=e.clientY-joy.y, d=Math.hypot(dx,dy), k=Math.min(1,JOY/(d||1));
  joy.kx=dx*k; joy.ky=dy*k;
  if (d>6) G.players[0].want=Math.atan2(dy,dx);
});
addEventListener('pointerup',()=>joy=null); addEventListener('pointercancel',()=>joy=null);
function drawJoy(){
  if (!joy||G.state!=='play') return;
  ctx.fillStyle='rgba(230,211,163,.22)'; ctx.strokeStyle='rgba(230,211,163,.7)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(joy.x,joy.y,JOY,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(230,211,163,.85)'; ctx.beginPath(); ctx.arc(joy.x+joy.kx,joy.y+joy.ky,JOY*.42,0,7); ctx.fill();
}

const coinText=()=>'<i class="coin"></i>금화 '+save.coins+'닢';
function showDock(){
  $('dock').hidden=false; $('haveDock').innerHTML=coinText();
  $('ships').innerHTML=SHIPS.map((sh,i)=>{
    const own=save.ships.includes(i), on=save.ship===i;
    return `<div class="ship"><canvas width="192" height="144"></canvas><h3>${sh.name}</h3><p>${sh.desc}</p>
      ${on?'<button disabled>지금 타는 배</button>':own?`<button data-pick="${i}">이 배 타기</button>`
        :`<button class="buy" data-buy="${i}" ${save.coins<sh.price?'disabled':''}>금화 ${sh.price}닢으로 사기</button>`}</div>`;
  }).join('');
  document.querySelectorAll('.ship').forEach((el,i)=>{
    const c=el.querySelector('canvas').getContext('2d');
    c.fillStyle='#1C5D73'; c.fillRect(0,0,192,144); c.fillStyle=SHIPS[i].color; c.beginPath(); c.arc(40,150,90,0,7); c.fill();
    c.translate(104,70); c.rotate(-.5); shipShape(c,44,SHIPS[i]);
  });
}
$('ships').onclick=e=>{
  const b=e.target.closest('button'); if (!b) return;
  if (b.dataset.buy){ const i=+b.dataset.buy; if (save.coins<SHIPS[i].price) return;
    save.coins-=SHIPS[i].price; save.ships.push(i); save.ship=i; }
  else if (b.dataset.pick) save.ship=+b.dataset.pick; else return;
  store(); showDock();
};
$('openDock').onclick=showDock;
$('closeDock').onclick=()=>{ $('dock').hidden=true; showChart(); };
function showChart(){
  G.state='chart'; $('result').hidden=true; $('hud').hidden=true; $('chart').hidden=false;
  $('haveChart').innerHTML=coinText();
  const pos=[[30,14],[70,48],[32,82]];
  $('route').innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path d="M30 14 C60 20,80 30,70 48 S20 60,32 82" fill="none" stroke="#22303F" stroke-width="2.5" stroke-dasharray="7 7" vector-effect="non-scaling-stroke"/></svg>`
   + SEAS.map((s,i)=>{
      const open=i===0||save.prog[i-1]>=100, done=save.prog[i]>=100;
      return `<button class="stop ${open?'':'locked'} ${done?'done':''}" style="left:${pos[i][0]}%;top:${pos[i][1]}%" data-i="${i}" ${open?'':'disabled'}>
        <canvas width="104" height="104"></canvas><span class="name brush">${s.name}</span>
        <span class="prog">${open?(done?'정복 완료':'정복도 '+save.prog[i]+'%'):'앞 바다를 정복하면 열려요'}</span></button>`;
    }).join('');
  document.querySelectorAll('.stop').forEach(b=>{
    const i=+b.dataset.i, m=landMask(SEAS[i]), c=b.querySelector('canvas').getContext('2d'), k=104/N;
    c.fillStyle='#C9AE72'; c.fillRect(0,0,104,104); c.fillStyle='#1C5D73';
    for (let j=0;j<N*N;j++) if (!m[j]) c.fillRect((j%N)*k,(j/N|0)*k,k+.4,k+.4);
    if (b.disabled){ c.strokeStyle='#B3262E'; c.lineWidth=7; c.lineCap='round';
      c.beginPath(); c.moveTo(30,30); c.lineTo(74,74); c.moveTo(74,30); c.lineTo(30,74); c.stroke(); }
    else b.onclick=()=>startRound(i);
  });
}
showChart();
