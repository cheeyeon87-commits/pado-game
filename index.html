<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>타이드 클레임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22303F;--paper:#E6D3A3;--paper-dark:#C9AE72;--sea:#1C5D73;--blood:#B3262E;--gold:#E9B63A}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--ink);
  font-family:"Gowun Batang",serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
.brush{font-family:"East Sea Dokdo","Gowun Batang",serif;font-weight:400}

/* 해도(바다 고르기) */
#chart{position:fixed;inset:0;overflow:hidden;padding:max(20px,env(safe-area-inset-top)) 20px 20px;
  background:
    radial-gradient(circle at 12% 8%,rgba(120,80,30,.28),transparent 34%),
    radial-gradient(circle at 92% 96%,rgba(120,80,30,.34),transparent 40%),
    radial-gradient(circle at 80% 30%,rgba(255,244,200,.5),transparent 45%),
    var(--paper)}
#chart h1{font-size:clamp(48px,14vw,96px);line-height:.8;transform:rotate(-4deg);transform-origin:left;margin-top:8px;width:max-content;pointer-events:none}
#chart .lead{margin-top:18px;font-size:16px;line-height:1.6;max-width:22em}
.route{position:absolute;left:0;right:0;top:230px;bottom:20px}
.route svg{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;transform:translate(-50%,-50%);background:none;border:0;color:inherit;font:inherit;
  text-align:center;cursor:pointer;padding:6px}
.stop canvas{position:static;width:104px;height:104px;border-radius:50%;border:3px solid var(--ink);
  box-shadow:0 0 0 5px var(--paper),0 0 0 6px var(--ink)}
.stop .name{display:block;font-size:40px;line-height:1;margin-top:8px}
.stop .prog{display:block;font-size:14px;margin-top:2px}
.stop:focus-visible canvas{outline:3px solid var(--blood);outline-offset:8px}
.stop.locked{cursor:default;opacity:.55}
.stop.done .prog{color:var(--blood);font-weight:700}

/* 게임 화면 */
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;padding:max(12px,env(safe-area-inset-top)) 12px 12px}
#goal{height:26px;border-radius:13px;background:rgba(18,30,45,.7);border:2px solid var(--paper);overflow:hidden;position:relative}
#goalFill{height:100%;width:0;background:var(--blood);transition:width .2s}
#bestMark{position:absolute;top:0;bottom:0;width:3px;background:#FFD34D;box-shadow:0 0 6px #FFD34D;z-index:1}
#goalText{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:14px}
#kills{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 36px);
  background:rgba(18,30,45,.7);border-radius:10px;padding:4px 10px;font-weight:700}
#board{position:absolute;right:12px;top:calc(max(12px,env(safe-area-inset-top)) + 36px);list-style:none;padding:0;
  font-size:13px;font-weight:700;width:156px;margin:0}
#board li{position:absolute;right:0;width:100%;height:24px;box-sizing:border-box;display:flex;align-items:center;
  justify-content:space-between;gap:8px;padding:0 8px;border-radius:8px;overflow:hidden;white-space:nowrap;
  background:rgba(18,30,45,.7);border-left:6px solid var(--c);transition:transform .35s ease,opacity .25s}
#board li::before{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);background:var(--c);opacity:.3;transition:width .3s}
#board li span{position:relative}
#board li.me{background:rgba(230,211,163,.92);color:var(--ink)}
#mini{position:absolute;inset:auto;left:12px;bottom:max(12px,env(safe-area-inset-bottom));width:112px;height:112px;
  border:2px solid var(--paper);border-radius:10px;background:rgba(18,30,45,.7)}
#hint{position:absolute;left:16px;right:16px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 128px);text-align:center;
  background:rgba(230,211,163,.94);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5}

#goal .tick{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:rgba(230,211,163,.45)}
#goal .tick.got{background:var(--gold)}
#purse{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 72px);
  background:rgba(18,30,45,.7);border-radius:10px;padding:4px 10px;font-weight:700;color:var(--gold)}
#buff{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 108px);
  background:rgba(230,211,163,.92);color:var(--ink);border-radius:10px;padding:4px 10px;font-weight:700}
.coin{display:inline-block;width:.85em;height:.85em;border-radius:50%;background:var(--gold);
  box-shadow:inset 0 0 0 2px #B98A1F;vertical-align:-.08em;margin-right:.3em}
#harbor{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;position:relative;z-index:2}
#harbor .have{margin-right:auto}
#harbor .have{font-weight:700;font-size:17px}
#harbor button,#dock .close{font:inherit;font-weight:700;font-size:15px;margin-top:8px;padding:9px 14px;
  background:var(--ink);color:var(--paper);border:0;border-radius:6px;cursor:pointer}
#dock,#settings{position:fixed;inset:0;background:var(--paper);overflow:auto;padding:max(20px,env(safe-area-inset-top)) 20px 28px;touch-action:pan-y}
#dock h2,#settings h2{font-size:64px;line-height:.9}
#settings .close{font:inherit;font-weight:700;font-size:15px;margin-top:8px;padding:9px 14px;background:var(--ink);color:var(--paper);border:0;border-radius:6px;cursor:pointer}
#settings .opt{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:2px solid var(--ink);font-size:18px;font-weight:700}
#settings .opt input{width:26px;height:26px;accent-color:var(--blood)}
#settings .line{display:block;width:100%;text-align:left;font:inherit;font-size:17px;font-weight:700;padding:14px 0;
  background:none;border:0;border-top:2px solid var(--ink);color:var(--ink);cursor:pointer}
#settings .line.danger{color:var(--blood)}
#settings .note{font-size:14px;line-height:1.5;padding:14px 0;border-top:2px solid var(--ink);margin-bottom:10px}
#settings button:focus-visible,#settings input:focus-visible{outline:3px solid var(--blood);outline-offset:2px}
#dock .have{font-weight:700;margin:6px 0 14px}
.ship{display:grid;grid-template-columns:96px 1fr;gap:4px 14px;align-items:center;padding:14px 0;border-top:2px solid var(--ink)}
.ship canvas{position:static;width:96px;height:72px;grid-row:span 3;border-radius:6px}
.ship h3{font-size:18px}
.ship p{font-size:14px;line-height:1.4}
.ship button{font:inherit;font-weight:700;font-size:15px;padding:9px 12px;border:2px solid var(--ink);border-radius:6px;
  background:transparent;color:var(--ink);cursor:pointer;justify-self:start}
.ship button.buy{background:var(--blood);border-color:var(--blood);color:#fff}
.ship button:disabled{opacity:.5;cursor:default}
#harbor button:focus-visible,#dock button:focus-visible{outline:3px solid var(--blood);outline-offset:2px}

/* 결과 */
#result{position:fixed;inset:0;display:grid;place-items:center;background:rgba(18,30,45,.6);padding:20px}
#result .card{background:var(--paper);border:3px solid var(--ink);border-radius:6px;padding:24px 22px;width:min(340px,100%);
  text-align:center;box-shadow:6px 8px 0 rgba(0,0,0,.35)}
#result h2{font-size:56px;line-height:.9}
#result dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;margin:18px 0;font-size:16px}
#result dd{font-weight:700;text-align:right}
#result button{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px;margin-top:10px;
  border:2px solid var(--ink);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
#result button.main{background:var(--blood);color:#fff;border-color:var(--blood)}
#result button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="goal"><div id="goalFill"></div><i class="tick" style="left:20%"></i><i class="tick" style="left:40%"></i><i class="tick" style="left:60%"></i><i class="tick" style="left:80%"></i><i id="bestMark" hidden></i><div id="goalText"></div></div>
  <div id="kills"></div>
  <div id="purse"></div>
  <div id="buff" hidden></div>
  <ol id="board"></ol>
  <canvas id="mini" width="224" height="224"></canvas>
  <div id="hint">화면 아무 곳이나 누르면 조이스틱이 생겨요. 가고 싶은 쪽으로 밀어요.<br>내 바다 밖으로 나갔다가 돌아오면, 물길로 둘러싼 곳이 내 바다가 돼요.<br>해안에 붙어서 가면 점점 빨라져요.</div>
</div>

<main id="chart">
  <div id="harbor"><div class="have" id="haveChart"></div><button id="openDock">내 배 고르기</button><button id="openSet">설정</button></div>
  <h1 class="brush">타이드 클레임</h1>
  <p class="lead">물길로 바다를 둘러싸서 내 것으로 만드세요. 바다 하나를 정복하면 다음 바다가 열려요.</p>
  <div class="route" id="route"></div>
</main>

<section id="dock" hidden>
  <h2 class="brush">조선소</h2>
  <p class="have" id="haveDock"></p>
  <div id="ships"></div>
  <button class="close" id="closeDock">해도로 돌아가기</button>
</section>

<section id="settings" hidden>
  <h2 class="brush">설정</h2>
  <label class="opt">효과음 <input type="checkbox" data-k="sfx"></label>
  <label class="opt">파도 소리 <input type="checkbox" data-k="bgm"></label>
  <label class="opt">진동 <input type="checkbox" data-k="vib"></label>
  <button class="line" id="tutAgain">처음 안내 다시 보기</button>
  <button class="line danger" id="wipe">기록 지우기</button>
  <p class="note">기록(정복도, 금화, 배)은 이 기기에만 저장되고 어디로도 보내지 않아요.</p>
  <button class="close" id="closeSet">해도로 돌아가기</button>
</section>

<div id="result" hidden>
  <div class="card">
    <h2 class="brush" id="rTitle"></h2>
    <dl>
      <dt>이번 항해에서 차지한 바다</dt><dd id="rShare"></dd>
      <dt>가라앉힌 배</dt><dd id="rKills"></dd>
      <dt>얻은 금화</dt><dd id="rCoins"></dd>
      <dt id="rSeaName"></dt><dd id="rProg"></dd>
    </dl>
    <button class="main" id="rMain"></button>
    <button id="rBack">해도로 돌아가기</button>
  </div>
</div>

<script>
// WU: 바다 크기(단위). U: 단위 하나를 몇 칸으로 쪼개는지(클수록 곡선이 곱다). 배 위치와 속도는 단위로 센다
const WU = 84, U = 2, N = WU*U, GOAL = 0.5;
// 바다 모양: [중심x, 중심y, 가로반지름, 세로반지름] 타원. sea는 바다, isl은 섬/육지 (단순화한 모양)
const SEAS = [
  {name:'카리브해', sea:[[.5,.52,.47,.36],[.24,.34,.22,.2]],
   isl:[[.42,.3,.14,.028],[.63,.37,.07,.035],[.44,.43,.04,.016],[.8,.42,.012,.02],[.84,.5,.012,.02],[.85,.6,.014,.022],[.82,.7,.016,.02]]},
  {name:'지중해', sea:[[.28,.5,.26,.2],[.68,.54,.3,.22],[.5,.46,.22,.13]],
   isl:[[.45,.36,.035,.15],[.5,.57,.045,.025],[.36,.44,.018,.04],[.72,.64,.05,.015],[.88,.57,.03,.015]]},
  {name:'인도양', sea:[[.5,.52,.46,.44]],
   isl:[[.55,.08,.1,.24],[.22,.68,.04,.1],[.61,.36,.02,.03],[.78,.3,.02,.06],[.4,.8,.015,.015]]},
];
const CREW = [
  {name:'나', color:'#C8323B'},
  {name:'외눈 메리', color:'#E0A82E', pat:'dots'},
  {name:'은갈고리 한', color:'#7D5BA6', pat:'scales'},
  {name:'검은돛 도로', color:'#2FA37A', pat:'stripes'},
  {name:'폭풍의 진', color:'#E07A2E', pat:'zigzag'},
  {name:'앵무 선장', color:'#E6DFCF', pat:'diamonds'},
];
// 내가 고를 수 있는 해적선(겉모습만 다르고 성능은 같다)
const SHIPS = [
  {name:'슬루프 "붉은 돛"', desc:'작고 날랜 첫 배.', price:0, color:'#C8323B', sail:'#F3E9D2', hull:'#3B2414', pat:'waves'},
  {name:'브리건틴 "푸른 밤"', desc:'돛대가 둘인 푸른 배.', price:100, color:'#4F7BE8', sail:'#DCE6FF', hull:'#22304F', masts:2, pat:'stars'},
  {name:'갤리온 "먹빛 돛"', desc:'검은 돛을 단 큰 배.', price:300, color:'#34323C', sail:'#17161B', hull:'#1E1410', masts:3, pat:'cross'},
  {name:'유령선 "새벽 안개"', desc:'안개처럼 빛나는 배.', price:600, color:'#9FE8D8', sail:'#E9FFF9', hull:'#4C6F6A', masts:3, pat:'fog'},
];
const ITEMS = {wind:{name:'순풍', sec:4}, shield:{name:'방어막', sec:7}};
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W, H, cs;
function resize(){
  const r = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight; cv.width = W*r; cv.height = H*r; ctx.setTransform(r,0,0,r,0,0);
  cs = Math.max(13, Math.min(W,H)/26);
}
addEventListener('resize', resize); resize();

let save;
try { save = JSON.parse(localStorage.getItem('pado-yeongto')); } catch(e){}
if (!save) save = {prog:[0,0,0]};
save.coins ??= 0; save.ships ??= [0]; save.ship ??= 0; save.set ??= {sfx:1, bgm:1, vib:1}; save.tut ??= 0; save.top ??= [0,0,0];
function store(){ try { localStorage.setItem('pado-yeongto', JSON.stringify(save)); } catch(e){} }

// 소리: 소리 파일 없이 브라우저가 직접 만드는 소리(권리 문제 없음). 휴대폰은 첫 터치 뒤에야 소리를 낼 수 있다
let AC=null, waves=null, bus=null;
function audioOn(){
  if (AC){ if (AC.state==='suspended') AC.resume(); return; }
  try { AC=new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }
  // 효과음 공통 길: 높은 쨍한 소리를 걸러 내고(부드럽게), 짧은 메아리를 살짝 섞는다(공간감)
  bus=AC.createGain(); const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; lp.Q.value=.5;
  const dl=AC.createDelay(), fb=AC.createGain(), wet=AC.createGain(); dl.delayTime.value=.16; fb.gain.value=.28; wet.gain.value=.22;
  bus.connect(lp).connect(AC.destination); lp.connect(dl); dl.connect(fb).connect(dl); dl.connect(wet).connect(AC.destination);
  setWaves();
}
addEventListener('pointerdown',audioOn);
// 음 하나: 살짝 부풀며 시작(at초)해서 천천히 사라진다. bell을 주면 한 옥타브 위 음을 작게 겹쳐 종소리처럼
function tone(f,t0,dur,type,vol,f2,bell){
  const o=AC.createOscillator(), g=AC.createGain(), at=Math.min(.03,dur*.3); o.type=type; o.frequency.setValueAtTime(f,t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+at); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g).connect(bus); o.start(t0); o.stop(t0+dur+.05);
  if (bell) tone(f*2,t0,dur*.7,'sine',vol*.25,f2&&f2*2);
}
const SFX={
  capture:t=>[523,659,784].forEach((f,k)=>tone(f,t+k*.08,.35,'sine',.16,0,1)),
  coin:t=>{ tone(988,t,.18,'sine',.09,0,1); tone(1319,t+.08,.4,'sine',.09,0,1); },
  item:t=>tone(660,t,.35,'sine',.12,1320),
  kill:t=>{ tone(200,t,.4,'sine',.18,70); tone(784,t+.06,.4,'sine',.09,0,1); },
  sink:t=>tone(330,t,1,'triangle',.12,90),
  win:t=>[523,659,784,1047].forEach((f,k)=>tone(f,t+k*.13,k===3?1.1:.35,'sine',.16,0,1)),
  tap:t=>tone(600,t,.08,'sine',.07),
};
function sfx(n){ if (AC&&save.set.sfx) SFX[n](AC.currentTime+.01); }
function buzz(ms){ if (save.set.vib&&navigator.vibrate) navigator.vibrate(ms); }
// 파도 소리: 낮게 걸러낸 잡음을 8초쯤 주기로 천천히 커졌다 작아지게
function setWaves(){
  if (!AC) return;
  if (save.set.bgm&&!waves){
    const len=AC.sampleRate*4, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0); let b=0;
    for (let i=0;i<len;i++){ b=(b+.02*(Math.random()*2-1))/1.02; d[i]=b*3.5; }
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600;
    const g=AC.createGain(); g.gain.value=.06;
    const lfo=AC.createOscillator(), lg=AC.createGain(); lfo.frequency.value=.12; lg.gain.value=.04; lfo.connect(lg).connect(g.gain);
    src.connect(lp).connect(g).connect(AC.destination); src.start(); lfo.start(); waves={src,lfo};
  } else if (!save.set.bgm&&waves){ waves.src.stop(); waves.lfo.stop(); waves=null; }
}

const G = {state:'chart', sea:0, players:[], best:0, fx:[], pop:[], rings:[], islands:[]};
// 효과: 반짝이는 알갱이(fx)와 떠오르는 글자(pop). 위치는 바다 단위 좌표
function burst(x,y,color,n,sp){
  for (let i=0;i<n;i++){ const a=Math.random()*6.283, v=sp*(.4+Math.random()), life=.5+Math.random()*.5;
    G.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,c:color,s:2+Math.random()*3}); }
  if (G.fx.length>400) G.fx.splice(0,G.fx.length-400);
}
function popText(x,y,text,color,big){ G.pop.push({x,y,text,c:color,t:0,big:big||1}); }
function ring(x,y,color,r){ G.rings.push({x,y,c:color,r,t:0}); }
function updateFx(dt){
  for (let i=G.fx.length-1;i>=0;i--){ const f=G.fx[i];
    f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=.95; f.vy*=.95; if ((f.life-=dt)<=0) G.fx.splice(i,1); }
  for (let i=G.pop.length-1;i>=0;i--){ if ((G.pop[i].t+=dt)>1.5) G.pop.splice(i,1); }
  for (let i=G.rings.length-1;i>=0;i--){ if ((G.rings[i].t+=dt)>.7) G.rings.splice(i,1); }
}
function drawFx(camx,camy){
  for (const q of G.rings){ const k=q.t/.7; ctx.globalAlpha=(1-k)*.8; ctx.strokeStyle=q.c; ctx.lineWidth=6*(1-k)+1;   // 빛 파동: 퍼지며 사라지는 동그라미 두 겹
    for (const d of [0,.25]){ const kk=Math.max(0,k-d); if (kk<=0) continue; ctx.beginPath(); ctx.arc(q.x*cs-camx,q.y*cs-camy,q.r*cs*(.3+kk*.9),0,7); ctx.stroke(); } }
  for (const f of G.fx){ ctx.globalAlpha=Math.max(0,f.life/f.max); ctx.fillStyle=f.c;
    ctx.beginPath(); ctx.arc(f.x*cs-camx,f.y*cs-camy,f.s,0,7); ctx.fill(); }
  ctx.globalAlpha=1; ctx.textAlign='center'; ctx.lineWidth=4; ctx.strokeStyle='rgba(18,30,45,.85)';
  for (const q of G.pop){ const k=q.t/1.5, s=1+Math.max(0,.25-q.t)*2;
    ctx.globalAlpha=k<.7?1:1-(k-.7)/.3; ctx.font=`700 ${Math.round(20*s*q.big)}px "Gowun Batang",serif`; ctx.fillStyle=q.c;
    const x=q.x*cs-camx, y=q.y*cs-camy-q.t*cs*1.6;
    ctx.strokeText(q.text,x,y); ctx.fillText(q.text,x,y); }

      if (b.isleT&&b.a0===to(b.isleT.x,b.isleT.y)){ let r=0; for (const i of b.isleT.shore) r=Math.max(r,Math.hypot((i%N+.5)/U-b.isleT.x,((i/N|0)+.5)/U-b.isleT.y)); b.L1=Math.min(18,td+r+1.5); b.L2=Math.min(18,2*r+3); b.isleT=null; }
    }
    b.want=b.a0;
  } else {
    b.d+=b.speed*.1;
    let danger=false;                       // 남의 배가 내 물길에, 내가 집에 가는 것보다 빨리 닿을 수 있나
    const dHome=Math.hypot(b.home[0]-b.x,b.home[1]-b.y);
    for (const o of G.players){ if (o===b||!o.alive) continue;
      for (let k=0;k<b.path.length;k+=4) if (Math.hypot(o.x-b.path[k][0],o.y-b.path[k][1])<dHome+3){ danger=true; break; }
      if (danger) break; }
    const phase = danger||b.d>=2*b.L1+b.L2 ? 3 : b.d<b.L1 ? 0 : b.d<b.L1+b.L2 ? 1 : 2;
    if (phase===3){
      if (own[cellAt(b.home[0],b.home[1])]!==b.id){ const h=scan(b,14,i=>own[i]===b.id); if (h) b.home=h; }
      b.want=to(b.home[0],b.home[1]); b.a0=null;
    } else {
      b.want=b.a0+b.s*phase*Math.PI/2;
      if (!clearAhead(b,b.want,2.5)) b.d=[b.L1,b.L1+b.L2,2*b.L1+b.L2][phase];   // 앞이 육지면 다음 변으로
    }
  }
  if (b.hunter&&(!out||b.trail.length<30)){
    const t=scan(b,5.5,i=>trail[i]>=0&&trail[i]!==b.id);
    if (t) b.want=to(t[0],t[1]);
  }
}

// 그리기: 칸 그대로가 아니라, 칸을 살짝 번지게 한 값에서 경계선을 뽑아 부드러운 곡선으로 그린다
const TH=.47;   // BW로 넓게 번지게 할수록 영토 가장자리가 고르다
let field=null;
function fields(x0,y0,x1,y1){
  const K=G.players.length+1;
  if (!field||field.length!==K){ field=Array.from({length:K},()=>new Float32Array(N*N)); seaW=new Float32Array(N*N); }
  for (const f of field) for (let y=y0;y<=y1;y++) f.fill(0,y*N+x0,y*N+x1+1);
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const n=y*N+x; let sw=0;
    for (let dy=-3;dy<=3;dy++) for (let dx=-3;dx<=3;dx++){
      const xx=x+dx, yy=y+dy, w=BW[dx+3]*BW[dy+3]/576;
      let id=K-1;
      if (xx>=0&&yy>=0&&xx<N&&yy<N){ const i=yy*N+xx; id=land[i]?K-1:own[i]; }
      if (id>=0) field[id][n]+=w;
      if (id!==K-1) sw+=w;
    }
    seaW[n]=sw;
  }
  // 영토는 "주변 바다 중 내 것의 비율"로 본다. 그래야 해안 앞에서 영토가 움츠러들지 않고 해안선까지 꽉 찬다(넘친 부분은 육지가 덮음)
  for (let id=0;id<K-1;id++){ const f=field[id];
    for (let y=y0;y<=y1;y++) for (let n=y*N+x0, e=y*N+x1;n<=e;n++) if (f[n]) f[n]/=seaW[n]; }
}
let seaW=null;
function contour(f,x0,y0,x1,y1,camx,camy){
  const cp=cs/U, P=new Path2D(), X=g=>(g+.5)*cp-camx, Y=g=>(g+.5)*cp-camy;
  const px=[0,1,1,0], py=[0,0,1,1], v=[0,0,0,0];
  for (let y=y0;y<y1;y++){
    let run=-1;
    for (let x=x0;x<=x1;x++){
      const n=y*N+x;
      if (x<x1){
        v[0]=f[n]; v[1]=f[n+1]; v[2]=f[n+N+1]; v[3]=f[n+N];
        const k=(v[0]>=TH)+(v[1]>=TH)+(v[2]>=TH)+(v[3]>=TH);
        if (k===4){ if (run<0) run=x; continue; }
        if (run>=0){ P.rect(X(run),Y(y),(x-run)*cp,cp+.5); run=-1; }
        if (!k) continue;
        let first=true;
        for (let i=0;i<4;i++){ const j=(i+1)&3;
          if (v[i]>=TH){ first?P.moveTo(X(x+px[i]),Y(y+py[i])):P.lineTo(X(x+px[i]),Y(y+py[i])); first=false; }
          if ((v[i]>=TH)!==(v[j]>=TH)){ const t=(TH-v[i])/(v[j]-v[i]);
            const qx=X(x+px[i]+(px[j]-px[i])*t), qy=Y(y+py[i]+(py[j]-py[i])*t);
            first?P.moveTo(qx,qy):P.lineTo(qx,qy); first=false; }
        }
        P.closePath();
      } else if (run>=0) P.rect(X(run),Y(y),(x-run)*cp,cp+.5);
    }
  }
  return P;
}
// 영토 무늬: 배마다 고유한 무늬를 영토 색 위에 옅게 겹친다. 무늬 한 칸(t×t)을 이어 붙이므로 칸 경계에 걸리는 모양은 9번 겹쳐 그린다
const PATN={waves:'물결', stars:'별', cross:'엇갈린 칼', fog:'안개', dots:'금화', scales:'비늘', stripes:'빗금', zigzag:'번갯길', diamonds:'마름모'};
const MOTIF={
  waves:(c,t)=>{ for (const [x,y] of [[.25,.35],[.75,.85]]){ c.beginPath(); c.arc(x*t,y*t,t*.2,Math.PI*1.15,Math.PI*1.85); c.stroke(); } },
  stars:(c,t)=>{ for (const [x,y,r] of [[.25,.3,.13],[.72,.75,.09]]){ c.beginPath();
    for (let k=0;k<8;k++){ const a=k*Math.PI/4, q=k%2?r*.35:r; c.lineTo((x+Math.cos(a)*q)*t,(y+Math.sin(a)*q)*t); } c.fill(); } },
  cross:(c,t)=>{ for (const [x,y] of [[.25,.25],[.75,.75]]){ const r=.11*t; c.beginPath(); c.moveTo(x*t-r,y*t-r); c.lineTo(x*t+r,y*t+r); c.moveTo(x*t+r,y*t-r); c.lineTo(x*t-r,y*t+r); c.stroke(); } },
  fog:(c,t)=>{ for (const [x,y,r] of [[.3,.3,.18],[.8,.78,.12]]){ c.beginPath(); c.arc(x*t,y*t,r*t,0,Math.PI*1.5); c.stroke(); } },
  dots:(c,t)=>{ for (const [x,y] of [[.25,.25],[.75,.75]]){ c.beginPath(); c.arc(x*t,y*t,t*.08,0,7); c.fill(); } },
  scales:(c,t)=>{ for (const [x,y] of [[0,.5],[.5,.5],[.25,1],[.75,1]]){ c.beginPath(); c.arc(x*t,y*t-t*.25,t*.25,0,Math.PI); c.stroke(); } },
  zigzag:(c,t)=>{ c.beginPath(); [[0,.4],[.25,.6],[.5,.4],[.75,.6],[1,.4]].forEach(([x,y])=>c.lineTo(x*t,y*t)); c.stroke(); },
  diamonds:(c,t)=>{ c.beginPath(); c.moveTo(.5*t,.36*t); c.lineTo(.62*t,.5*t); c.lineTo(.5*t,.64*t); c.lineTo(.38*t,.5*t); c.fill(); },
};
const patCache={};
function territoryPattern(target,pat,color,t){
  const key=(target===ctx?'g':'s')+pat+color+t; if (patCache[key]) return patCache[key];
  const tile=document.createElement('canvas'); tile.width=tile.height=t; const c=tile.getContext('2d');
  const n=parseInt(color.slice(1),16), lum=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255;
  c.strokeStyle=c.fillStyle=lum>.6?'rgba(60,40,20,.16)':'rgba(255,255,255,.2)'; c.lineWidth=Math.max(1.5,t*.07); c.lineCap='round';
  if (pat==='stripes'){ c.beginPath(); for (const o of [-t,0,t]){ c.moveTo(o,t); c.lineTo(o+t,0); } c.stroke(); }
  else for (const dx of [-t,0,t]) for (const dy of [-t,0,t]){ c.save(); c.translate(dx,dy); MOTIF[pat](c,t); c.restore(); }
  return patCache[key]=target.createPattern(tile,'repeat');
}
// 섬 표시: 섬 위의 둥근 표지에 능력 그림, 둘레 고리는 가장 많이 차지한 배 색으로 차올라 80%가 되면 한 바퀴
function drawIslands(camx,camy){
  for (const is of G.islands){
    const x=is.x*cs-camx, y=is.y*cs-camy; if (x<-60||y<-60||x>W+60||y>H+60) continue;
    const r=cs*.95, held=is.owner>=0;
    let bi=-1, bs=0; is.share.forEach((s,k)=>{ if (s>bs){ bs=s; bi=k; } });
    ctx.lineWidth=cs*.28; ctx.strokeStyle='rgba(18,30,45,.55)'; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke();
    if (bi>=0&&bs>.01){ ctx.strokeStyle=G.players[bi].color; ctx.beginPath(); ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.min(1,bs/ISL_NEED)*Math.PI*2); ctx.stroke(); }
    ctx.fillStyle=held?'rgba(255,248,220,.97)':'rgba(255,248,220,.78)'; ctx.beginPath(); ctx.arc(x,y,r*.78,0,7); ctx.fill();
    ctx.font=`${cs*1.05}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#000'; ctx.fillText(is.kind.icon,x,y+1);
  }
}
const shade=(hex,k)=>'#'+[1,3,5].map(i=>Math.round(parseInt(hex.slice(i,i+2),16)*k).toString(16).padStart(2,'0')).join('');
function draw(){
  const me=G.players[0], camx=me.x*cs-W/2, camy=me.y*cs-H/2, K=G.players.length+1, cp=cs/U;
  ctx.fillStyle='#1C5D73'; ctx.fillRect(0,0,W,H);
  const x0=Math.max(0,Math.floor(camx/cp)-3), y0=Math.max(0,Math.floor(camy/cp)-3);
  const x1=Math.min(N-1,Math.ceil((camx+W)/cp)+2), y1=Math.min(N-1,Math.ceil((camy+H)/cp)+2);
  fields(x0,y0,x1,y1);
  for (const p of G.players){
    if (!p.alive) continue;
    const P=contour(field[p.id],x0,y0,x1,y1,camx,camy);
    ctx.save(); ctx.translate(0,cs*.2); ctx.fillStyle=p.dark||(p.dark=shade(p.color,.6)); ctx.fill(P); ctx.restore();
    ctx.fillStyle=p.color; ctx.fill(P);
    if (p.pat){ const pt=territoryPattern(ctx,p.pat,p.color,Math.round(cs*2.4)); pt.setTransform(new DOMMatrix([1,0,0,1,-camx,-camy])); ctx.fillStyle=pt; ctx.fill(P); }
  }
  // 물길: 배가 실제로 지나간 길을 따라 굵은 띠로 그린다
  ctx.lineCap=ctx.lineJoin='round'; ctx.lineWidth=cs*.8; ctx.globalAlpha=.7;
  for (const p of G.players){
    if (!p.alive||!p.path.length) continue;
    ctx.strokeStyle=p.color; ctx.beginPath(); ctx.moveTo(p.path[0][0]*cs-camx,p.path[0][1]*cs-camy);
    for (const q of p.path) ctx.lineTo(q[0]*cs-camx,q[1]*cs-camy);
    ctx.lineTo(p.x*cs-camx,p.y*cs-camy); ctx.stroke();
  }
  ctx.globalAlpha=1;
  const L=contour(field[K-1],x0,y0,x1,y1,camx,camy);
  ctx.strokeStyle='rgba(243,233,200,.5)'; ctx.lineWidth=cs*.45; ctx.stroke(L);
  ctx.fillStyle='#D9C48F'; ctx.fill(L);
  const gx0=.5*cp-camx, gy0=.5*cp-camy, gx1=(N-.5)*cp-camx, gy1=(N-.5)*cp-camy;
  ctx.fillRect(0,0,W,gy0+1); ctx.fillRect(0,gy1-1,W,H); ctx.fillRect(0,0,gx0+1,H); ctx.fillRect(gx1-1,0,W,H);
  drawItems(camx,camy); drawIslands(camx,camy);
  for (const p of G.players) if (p.alive&&p.id) drawShip(p,camx,camy);
  if (me.alive) drawShip(me,camx,camy);
  drawFx(camx,camy);
  drawJoy();
}

let last=0, hudT=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0); last=t;
  if (G.state==='play'){
    G.t+=dt;
    if (G.tut>=0) tutorial(dt); else if (G.t>5) $('hint').hidden=true;
    updateFx(dt);
    for (const p of G.players){
      if (!p.alive){ if (p.id&&(p.respawn-=dt)<0) spawn(p); continue; }
      if (p.id) think(p,dt);
      islandTick(p,dt);
      step(p,dt);
      if (G.state!=='play') break;
    }
    if (G.state==='play'){
      const share=G.players[0].count/seaTotal; if (share>G.best) G.best=share;
      while (G.mile<4&&share>=(G.mile+1)*GOAL/5){ G.mile++; G.coins+=10; sfx('coin'); }
      if ((G.itemT-=dt)<0&&G.items.length<4){ G.itemT=6;
        for (let t=0;t<40;t++){ const x=2+Math.random()*(WU-4), y=2+Math.random()*(WU-4);
          if (!isLand(x,y)){ G.items.push({x,y,type:Math.random()<.5?'wind':'shield'}); break; } } }
      if ((hudT+=dt)>.2){ hudT=0; hud(); }
      if (share>=GOAL) endRound(true);
    }
  }
  if (G.state!=='chart') draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 조종: 손가락을 댄 자리에 작은 조이스틱이 생긴다. 그 중심에서 손가락을 민 방향으로 배가 간다
const JOY=34;
let joy=null;
cv.addEventListener('pointerdown',e=>{ if (G.state==='play') joy={x:e.clientX,y:e.clientY,kx:0,ky:0}; });
cv.addEventListener('pointermove',e=>{
  if (!joy||G.state!=='play') return;
  const dx=e.clientX-joy.x, dy=e.clientY-joy.y, d=Math.hypot(dx,dy), k=Math.min(1,JOY/(d||1));
  joy.kx=dx*k; joy.ky=dy*k;
  if (d>6) G.players[0].want=Math.atan2(dy,dx);
});
addEventListener('pointerup',()=>joy=null); addEventListener('pointercancel',()=>joy=null);
function drawJoy(){
  if (!joy||G.state!=='play') return;
  ctx.fillStyle='rgba(230,211,163,.22)'; ctx.strokeStyle='rgba(230,211,163,.7)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(joy.x,joy.y,JOY,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(230,211,163,.85)'; ctx.beginPath(); ctx.arc(joy.x+joy.kx,joy.y+joy.ky,JOY*.42,0,7); ctx.fill();
}

const coinText=()=>'<i class="coin"></i>금화 '+save.coins+'닢';
function showDock(){
  $('dock').hidden=false; $('haveDock').innerHTML=coinText();
  $('ships').innerHTML=SHIPS.map((sh,i)=>{
    const own=save.ships.includes(i), on=save.ship===i;
    return `<div class="ship"><canvas width="192" height="144"></canvas><h3>${sh.name}</h3><p>${sh.desc} 영토 무늬: ${PATN[sh.pat]}</p>
      ${on?'<button disabled>지금 타는 배</button>':own?`<button data-pick="${i}">이 배 타기</button>`
        :`<button class="buy" data-buy="${i}" ${save.coins<sh.price?'disabled':''}>금화 ${sh.price}닢으로 사기</button>`}</div>`;
  }).join('');
  document.querySelectorAll('.ship').forEach((el,i)=>{
    const c=el.querySelector('canvas').getContext('2d');
    c.fillStyle='#1C5D73'; c.fillRect(0,0,192,144); c.fillStyle=SHIPS[i].color; c.beginPath(); c.arc(40,150,90,0,7); c.fill();
    c.fillStyle=territoryPattern(c,SHIPS[i].pat,SHIPS[i].color,30); c.fill();
    c.translate(104,70); c.rotate(-.5); shipShape(c,44,SHIPS[i]);
  });
}
$('ships').onclick=e=>{
  const b=e.target.closest('button'); if (!b) return;
  if (b.dataset.buy){ const i=+b.dataset.buy; if (save.coins<SHIPS[i].price) return;
    save.coins-=SHIPS[i].price; save.ships.push(i); save.ship=i; }
  else if (b.dataset.pick) save.ship=+b.dataset.pick; else return;
  store(); showDock();
};
$('openDock').onclick=showDock;
// 설정: 켜고 끈 것은 바로 저장된다. 기록 지우기는 실수로 지우지 않게 4초 안에 두 번 눌러야 한다
let wipeT=0;
function showSettings(){
  $('settings').hidden=false;
  document.querySelectorAll('#settings input').forEach(el=>el.checked=!!save.set[el.dataset.k]);
  $('tutAgain').textContent=save.tut?'처음 안내 다시 보기':'처음 안내 다시 보기 (다음 판에 나와요)';
  $('wipe').textContent='기록 지우기'; wipeT=0;
}
$('openSet').onclick=showSettings;
$('settings').onchange=e=>{ const k=e.target.dataset.k; if (!k) return; save.set[k]=e.target.checked?1:0; store(); setWaves(); if (k==='sfx') sfx('tap'); if (k==='vib') buzz(30); };
addEventListener('click',e=>{ if (e.target.closest('button')) sfx('tap'); });
$('tutAgain').onclick=()=>{ save.tut=0; store();$('tutAgain').textContent='처음 안내 다시 보기 (다음 판에 나와요)'; };
$('wipe').onclick=()=>{
  if (performance.now()-wipeT>4000){ wipeT=performance.now(); $('wipe').textContent='정말 지울까요? 한 번 더 누르면 정복도·금화·배가 모두 지워져요'; return; }
  save={prog:[0,0,0], coins:0, ships:[0], ship:0, set:save.set, tut:0}; store();
  $('wipe').textContent='지웠어요'; wipeT=0;
};
$('closeSet').onclick=()=>{ $('settings').hidden=true; showChart(); };
$('closeDock').onclick=()=>{ $('dock').hidden=true; showChart(); };
function showChart(){
  G.state='chart'; $('result').hidden=true; $('hud').hidden=true; $('chart').hidden=false;
  $('haveChart').innerHTML=coinText();
  const pos=[[30,14],[70,48],[32,82]];
  $('route').innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path d="M30 14 C60 20,80 30,70 48 S20 60,32 82" fill="none" stroke="#22303F" stroke-width="2.5" stroke-dasharray="7 7" vector-effect="non-scaling-stroke"/></svg>`
   + SEAS.map((s,i)=>{
      const open=i===0||save.prog[i-1]>=100, done=save.prog[i]>=100;
      return `<button class="stop ${open?'':'locked'} ${done?'done':''}" style="left:${pos[i][0]}%;top:${pos[i][1]}%" data-i="${i}" ${open?'':'disabled'}>
        <canvas width="104" height="104"></canvas><span class="name brush">${s.name}</span>
        <span class="prog">${open?(done?'정복 완료':'정복도 '+save.prog[i]+'%'):'앞 바다를 정복하면 열려요'}</span></button>`;
    }).join('');
  document.querySelectorAll('.stop').forEach(b=>{
    const i=+b.dataset.i, m=landMask(SEAS[i]), c=b.querySelector('canvas').getContext('2d'), k=104/N;
    c.fillStyle='#C9AE72'; c.fillRect(0,0,104,104); c.fillStyle='#1C5D73';
    for (let j=0;j<N*N;j++) if (!m[j]) c.fillRect((j%N)*k,(j/N|0)*k,k+.4,k+.4);
    if (b.disabled){ c.strokeStyle='#B3262E'; c.lineWidth=7; c.lineCap='round';
      c.beginPath(); c.moveTo(30,30); c.lineTo(74,74); c.moveTo(74,30); c.lineTo(30,74); c.stroke(); }
    else b.onclick=()=>startRound(i);
  });
}
showChart();
</script>
